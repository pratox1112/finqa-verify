[project]
name = "finqa"
version = "0.1.0"
description = "When Does Verification Help? Agentic retrieval and grounded verification in numerical financial QA"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "edgartools>=5.62.1",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "langfuse>=5.1.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "integration: calls external services (Groq, EDGAR, Hugging Face, yfinance); skipped in default CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # docs show code in compact form; don't reformat it

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
