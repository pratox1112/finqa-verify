# DEV ONLY: R0-V0 on the self-hosted vLLM server (Explorer A100), for the Groq vs self-hosted
# agreement check before the model switch. Same weights, temperature, thinking and max tokens as
# configs/base.yaml; only the serving changes. The runner refuses this file on the test split
# (its model settings differ from base.yaml).
model:
  id: "vllm:Qwen/Qwen3.8-27B"   # served model name; VLLM_BASE_URL points at the tunnel
  temperature: 0
  thinking: "off"
  max_tokens: 2048
llm:
  requests_per_minute: null     # own GPU: no provider rate limit
  tokens_per_minute: null
retrieval:
  arm: "rag"
  calculator: false
verification:
  arm: "none"
