# Defaults for every experiment. Override files change only the fields that define them.
# The model: section is frozen once on main (CI frozen-file guard; ROADMAP rule 5).
model:
  id: "vllm:Qwen/Qwen3.8-27B"   # self-hosted vLLM on an Explorer A100, HF commit 37561816 (docs/DECISIONS.md 2026-11-08); was groq:qwen/qwen3.8-27b
  temperature: 0
  thinking: "off"               # fixed for every run
  max_tokens: 2048
llm:
  max_retries: 6                # retries on HTTP 429 / 5xx with exponential backoff
  requests_per_minute: null     # own GPU: no provider rate limit (Groq free tier was 30)
  tokens_per_minute: null       # own GPU: no provider rate limit (Groq free tier was 8000)
  cache_dir: ".cache/llm"       # gitignored; share via the shared artifact location
retrieval:
  arm: "rag"                    # closed_book | rag | agentic
  calculator: false             # R0 has no calculator, R1 does; see docs/DECISIONS.md
  top_k: 5
  max_agent_steps: 8
  resolver_threshold: 90        # company resolver: score (0-100) for one confident match
  resolver_margin: 5            # ... and its lead over the next company; else candidates
  rag_text_chunks: 1            # R0 retrieves top_k tables plus this many text chunks
verification:
  arm: "none"                   # none | self_check | grounded
  max_revisions: 2
  tolerance: 0.01               # 1% relative tolerance
embedding:
  model: "BAAI/bge-base-en-v1.5"
  query_instruction: "Represent this sentence for searching relevant passages: "
chunking:                       # smaller than the roadmap's sizes; see docs/DECISIONS.md
  text_max_tokens: 450          # fits the embedding model's 512-token window
  overlap_tokens: 60
  table_max_tokens: 800         # top-5 chunks stay well under Groq's 7,000 input tokens
diagnostics:                    # retrieval diagnostic; calibration in docs/DECISIONS.md
  evidence_shingle_size: 4      # word 4-grams
  evidence_overlap_threshold: 0.6
data:
  question_split: "dev"         # dev | test; test runs only from clean main (ROADMAP T12)
